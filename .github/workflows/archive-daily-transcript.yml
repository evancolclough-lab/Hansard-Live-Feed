name: Archive daily transcript

on:
  schedule:
    # Two runs a day, both safely before midnight Atlantic in either DST
    # state — the script labels the file with the *Atlantic* calendar date
    # at run time, and 03:00 UTC (the original choice) is 00:00 ADT in
    # summer, which would have dated a sitting's transcript as the next day
    # and may fall after StreamText has started a new day.
    #
    #   22:15 UTC = 18:15 ADT / 17:15 AST  — soon after a typical afternoon
    #       sitting: a snapshot in case the feed vanishes once the
    #       captioner disconnects (the feed only holds the current session)
    #   02:15 UTC = 23:15 ADT / 22:15 AST  — the late run, to catch anything
    #       said after the early one
    #
    # A later run replaces the day's file only if it actually finds content,
    # so the early snapshot is never lost to an empty late run. (Minute :15
    # rather than :00 so we don't push at the same instant as the
    # */30 Hansard-PDF workflow.)
    - cron: "15 22 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab, e.g. to test

permissions:
  contents: write

concurrency:
  group: archive-daily-transcript
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and reconstruct today's transcript
        id: archive
        run: python scripts/archive_daily_transcript.py

      - name: Commit transcript file
        if: steps.archive.outputs.has_content == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "transcripts/${{ steps.archive.outputs.date }}.txt"

          # A later run the same day can find exactly what an earlier one
          # did (or a manual re-run can), and `git commit` exits non-zero
          # when there's nothing to commit — that must not fail the job.
          if git diff --cached --quiet; then
            echo "Transcript for ${{ steps.archive.outputs.date }} is unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "chore: archive transcript for ${{ steps.archive.outputs.date }}"
          # The Hansard-PDF workflow may have pushed since we checked out;
          # rebase onto it rather than failing with a rejected push.
          git pull --rebase origin main
          git push

      - name: Notify Google Sheet
        if: steps.archive.outputs.has_content == 'true'
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$SHEETS_WEBHOOK_URL" ]; then
            echo "SHEETS_WEBHOOK_URL secret not set — skipping Sheets notification (transcript file was still archived to the repo above)."
            exit 0
          fi

          FILE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/transcripts/${{ steps.archive.outputs.date }}.txt"

          curl -sS -X POST "$SHEETS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                --arg token "$SHEETS_WEBHOOK_TOKEN" \
                --arg date "${{ steps.archive.outputs.date }}" \
                --arg sitting "${{ steps.archive.outputs.sitting }}" \
                --arg pages "${{ steps.archive.outputs.pages }}" \
                --arg wordCount "${{ steps.archive.outputs.word_count }}" \
                --arg charCount "${{ steps.archive.outputs.char_count }}" \
                --arg fileUrl "$FILE_URL" \
                --arg archivedAt "${{ steps.archive.outputs.archived_at }}" \
                '{token: $token, date: $date, sitting: $sitting, pages: $pages, wordCount: $wordCount, charCount: $charCount, fileUrl: $fileUrl, archivedAt: $archivedAt}')"
